<nav class="navbar navbar-expand-lg navbar-dark sticky-top sj-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center" routerLink="/">
      <img src="favicon.svg" alt="Logo Sala de Juegos" width="28" height="28" class="me-2" />
      Sala de Juegos
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navContent"
      aria-controls="navContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >Inicio</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/quien-soy" routerLinkActive="active">Quién Soy</a>
        </li>

        @if (user()) {
          @if (profile(); as p) {
            <li class="nav-item ms-lg-3">
              <span class="navbar-text text-white-50 small">
                <i class="bi bi-person-circle me-1"></i>{{ p.nombre }}
              </span>
            </li>
          }
          <li class="nav-item ms-lg-2">
            <button
              type="button"
              class="btn btn-sm btn-outline-light"
              (click)="logout()"
            >
              <i class="bi bi-box-arrow-right me-1"></i>Salir
            </button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/registro" routerLinkActive="active">Registro</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
